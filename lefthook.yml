# Git hooks, installed on request: `pnpm hooks` (lefthook install).
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,mts,cts,js,mjs,cjs,json,md,yml,yaml}'
      run: pnpm exec prettier --check {staged_files}
    lint:
      glob: '*.{ts,mts,cts,js,mjs,cjs}'
      run: pnpm exec eslint {staged_files}
pre-push:
  commands:
    check:
      run: pnpm run typecheck && pnpm run boundaries
