name: release

# Publishes the @electron-agent-bridge/* packages. Manual only; `dry-run` (the default) packs and checks
# everything without publishing. Versions come from changesets (`pnpm version-packages`).
#
# npm authenticates through trusted publishing (GitHub's OIDC token; no npm token is stored) and
# attaches a provenance attestation to each package. Each package's trusted publisher on npmjs.com:
# owner Chavagov123, repository electron-agent-bridge, workflow release.yml.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack and check only, do not publish'
        type: boolean
        default: true

permissions:
  # Tags and the GitHub release.
  contents: write
  # Trusted publishing and provenance.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Builds, then publint + arethetypeswrong for every package.
      - run: pnpm run check:packages
      - name: Publish (dependencies first; versions already on npm are skipped)
        run: node scripts/publish-packages.mjs ${{ inputs.dry-run && '--dry-run' || '' }}
      - name: Tags and GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          for manifest in packages/*/package.json; do
            spec="$(node -p "const p = require('./$manifest'); p.name + '@' + p.version")"
            git rev-parse -q --verify "refs/tags/$spec" > /dev/null || git tag "$spec"
          done
          git rev-parse -q --verify "refs/tags/v$version" > /dev/null || git tag "v$version"
          git push origin --tags
          if ! gh release view "v$version" > /dev/null 2>&1; then
            node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
            pre=""
            case "$version" in *-*) pre="--prerelease" ;; esac
            gh release create "v$version" --title "v$version" --notes-file "$RUNNER_TEMP/notes.md" $pre
          fi
      # The MCP registry entry (server.json), for stable versions. The registry checks `mcpName` in the
      # published @electron-agent-bridge/mcp; GitHub's OIDC token proves the io.github.Chavagov123 namespace.
      - name: MCP registry
        if: ${{ !inputs.dry-run }}
        run: |
          version="$(node -p "require('./packages/mcp/package.json').version")"
          case "$version" in *-*) echo "Pre-release $version: not listed in the MCP registry."; exit 0 ;; esac
          # The registry checks npm for the version: a new one can take minutes to be served.
          for attempt in $(seq 1 60); do
            npm view "@electron-agent-bridge/mcp@$version" version > /dev/null 2>&1 && break
            echo "waiting for @electron-agent-bridge/mcp@$version on npm ($attempt)"; sleep 10
          done
          curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
