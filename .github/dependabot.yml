version: 2
updates:
  # pnpm workspace; minor and patch updates of each kind arrive as one pull request a week.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # The e2e suite pins the Electron majors it tests; new majors are added on purpose.
      - dependency-name: electron
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
