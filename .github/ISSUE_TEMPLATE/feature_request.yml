name: Feature request
description: Something the bridge should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, for an agent, a test or a script, and where the bridge falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The tool, option or behaviour you have in mind, if any.
