<!doctype html><html><body><h1>S2</h1>
<iframe id="same" src="sub.html"></iframe>
<iframe id="cross" src="CROSS_ORIGIN/sub.html"></iframe>
<webview id="wv" src="sub.html" style="width:200px;height:100px"></webview>
<script>
(async () => {
  const pings = [];
  for (let i = 0; i < 500; i += 1) { window.api.evt(i); pings.push(window.api.ping(i)); }
  await Promise.all(pings);
  setTimeout(() => window.api.done(), 1500);
})();
</script></body></html>
